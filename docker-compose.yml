# Start with ./run.sh (Linux, macOS, Git Bash) or run.cmd (Windows) at least once.
# They add docker-compose.gpu.yml when Docker can use an NVIDIA GPU and save that
# choice in .env, so a plain `docker compose up` repeats it; until then it is CPU.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    # Live code reload, and uploads must outlive the container
    # (.dockerignore excludes *.mp4, so the image ships no test video).
    volumes:
      - .:/app
      - /app/.venv
      - huggingface-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    command: streamlit run ui/app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
    volumes:
      - .:/app
      - /app/.venv

volumes:
  huggingface-cache:
